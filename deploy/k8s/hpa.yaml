apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dock
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dock
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      # Slow to scale down: the rate limiter's buckets are per process, so
      # shedding replicas concentrates traffic onto the survivors without
      # enlarging their buckets. Scaling down eagerly turns a traffic dip into
      # a wave of 429s.
      stabilizationWindowSeconds: 300
