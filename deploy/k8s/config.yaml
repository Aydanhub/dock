apiVersion: v1
kind: ConfigMap
metadata:
  name: dock-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  REQUIRE_API_KEY: "true"
  RATE_LIMIT_REQUESTS: "120"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  # Below the pod's terminationGracePeriodSeconds, so the drain completes.
  SHUTDOWN_GRACE_SECONDS: "15"
  OTEL_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
---
apiVersion: v1
kind: Secret
metadata:
  name: dock-secrets
type: Opaque
stringData:
  # Placeholder. In a real cluster this comes from a secret manager — External
  # Secrets, Vault, SOPS — never from a file committed next to the manifests.
  API_KEYS: "replace-me-with-a-real-key"
