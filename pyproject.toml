[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dock"
version = "1.0.0"
description = "Production-ready FastAPI template for AI-powered backend services."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aydan Özkan" }]
keywords = ["fastapi", "template", "machine-learning", "observability", "production"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3",
    "prometheus-client>=0.20,<1",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "hypothesis>=6.100,<7",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]
otlp = ["opentelemetry-exporter-otlp>=1.25,<2"]

[project.urls]
Homepage = "https://github.com/Aydanhub/dock"
Issues = "https://github.com/Aydanhub/dock/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # pytest is built on assert
    "E501",  # line length is formatter territory, not lint territory
]

[tool.ruff.lint.per-file-ignores]
# Table-formatted constants stay readable as written; the formatter would
# reflow the hour-weight matrix into one column and lose the 24-hour shape.
"app/services/anomaly_service.py" = ["E231", "E241"]
"tests/*" = ["S105", "S106"]
"demo/*" = ["S105", "S106", "T201"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on Depends()/Query()/Body() being
# evaluated at definition time — the documented pattern, not the mutable-
# default-argument bug B008 normally guards against.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
]

[tool.mypy]
# No `python_version` pin on purpose. Pinning it to the minimum supported
# version makes mypy parse the *installed* third-party stubs under those
# older syntax rules, and numpy's stubs use `type` statements that only parse
# on 3.12+ — a failure about numpy's own files, not about this code. Letting
# mypy follow the interpreter means the CI matrix checks each version against
# the dependency set that version actually resolves to.
strict = true
warn_unreachable = true
# scikit-learn and the OTel instrumentation packages ship no stubs; typing the
# boundary in our own code is what matters, so their absence is tolerated
# rather than papered over with `Any` in our signatures.
[[tool.mypy.overrides]]
module = ["sklearn.*", "opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/evals/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
